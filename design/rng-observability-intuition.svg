<g class="c-red"><rect x="420" y="790" width="120" height="26" rx="4" stroke-width="1.5"/><text class="ts" x="480" y="807" text-anchor="middle" fill="#791F1F">optic-12</text></g>
<rect class="c-red" x="552" y="794" width="64" height="18" rx="9" stroke-width="0.5"/>
<text class="ts" x="584" y="807" text-anchor="middle" fill="#791F1F">culprit</text>
<g class="c-gray"><rect x="420" y="848" width="120" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="480" y="865" text-anchor="middle">panel-3</text></g>
<text class="ts" x="552" y="865">✕ cleared (alibi)</text>
<g class="c-gray"><rect x="420" y="906" width="120" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="480" y="923" text-anchor="middle">room-0</text></g>
<text class="ts" x="552" y="923">✕ cleared (alibi)</text>

<text class="ts" x="340" y="972" text-anchor="middle">The solver asks: what is the smallest set of parts that explains every sick route?</text>
<text class="ts" x="340" y="990" text-anchor="middle">Healthy routes are the key clue — a suspect whose other routes are fine has an alibi.</text>
<text class="ts" x="340" y="1008" text-anchor="middle">Output: a ranked list of parts to drain or swap — flagged honestly as correlation, not proof.</text>
<text class="ts" x="340" y="1036" text-anchor="middle" opacity="0.7">github.com/johnpatrickwarren-oss/tessera-rng</text>
