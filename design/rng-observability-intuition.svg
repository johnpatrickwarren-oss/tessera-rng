<text class="ts" x="258" y="22">infrastructure</text>

<text class="th" x="340" y="52" text-anchor="middle">Finding a failing part in a network designed to hide failures</text>
<text class="ts" x="340" y="70" text-anchor="middle">How Tessera-RNG watches an AWS-style random-graph (RNG) datacenter fabric</text>

<!-- ===== Section 1 ===== -->
<text class="th" x="40" y="100">1 · Two ways to wire a datacenter</text>
<text class="ts" x="175" y="124" text-anchor="middle">Fat-tree — the old way</text>
<text class="ts" x="505" y="124" text-anchor="middle">RNG — the new way</text>

