<text class="ts" x="175" y="292" text-anchor="middle">an org chart: traffic goes up and over</text>
<text class="ts" x="175" y="308" text-anchor="middle">lose the wrong top box → big outage</text>

<g stroke="#888780" stroke-width="1" opacity="0.45">
<line x1="395" y1="144" x2="455" y2="132"/><line x1="455" y1="132" x2="525" y2="139"/><line x1="525" y1="139" x2="590" y2="149"/><line x1="590" y1="149" x2="630" y2="199"/>
