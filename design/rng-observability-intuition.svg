<!-- right column -->
<g class="c-red"><rect x="460" y="702" width="130" height="26" rx="4" stroke-width="1.5"/><text class="ts" x="525" y="719" text-anchor="middle" fill="#791F1F">optic-12</text></g>
<rect class="c-red" x="598" y="706" width="56" height="18" rx="9" stroke-width="0.5"/>
<text class="ts" x="626" y="719" text-anchor="middle" fill="#791F1F">rank-1</text>
<g class="c-gray"><rect x="460" y="756" width="130" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="525" y="773" text-anchor="middle">panel-3</text></g>
<text class="ts" x="598" y="773">✕ falsified</text>
<g class="c-gray"><rect x="460" y="810" width="130" height="26" rx="4" stroke-width="0.5"/><text class="ts" x="525" y="827" text-anchor="middle">room-0</text></g>
<text class="ts" x="598" y="827">✕ falsified</text>

<text class="ts" x="340" y="884" text-anchor="middle">Noisy-OR set cover finds the smallest resource set explaining every firing leaf;</text>
<text class="ts" x="340" y="902" text-anchor="middle">a candidate whose other traffic is demonstrably healthy is ruled out.</text>
