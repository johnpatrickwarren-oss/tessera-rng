<line x1="455" y1="132" x2="425" y2="194"/><line x1="525" y1="139" x2="495" y2="202"/><line x1="525" y1="139" x2="560" y2="204"/><line x1="455" y1="256" x2="425" y2="194"/>
<line x1="495" y1="202" x2="455" y2="132"/>
</g>
<circle class="c-blue" cx="395" cy="144" r="8" stroke-width="0.5"/>
<circle class="c-blue" cx="455" cy="132" r="8" stroke-width="0.5"/>
