<g stroke="#888780" stroke-width="1" opacity="0.45">
<line x1="395" y1="100" x2="455" y2="88"/><line x1="455" y1="88" x2="525" y2="95"/><line x1="525" y1="95" x2="590" y2="105"/><line x1="590" y1="105" x2="630" y2="155"/>
<line x1="630" y1="155" x2="595" y2="205"/><line x1="595" y1="205" x2="525" y2="222"/><line x1="525" y1="222" x2="455" y2="212"/><line x1="455" y1="212" x2="390" y2="200"/>
<line x1="390" y1="200" x2="395" y2="100"/><line x1="395" y1="100" x2="425" y2="150"/><line x1="425" y1="150" x2="495" y2="158"/><line x1="495" y1="158" x2="560" y2="160"/>
<line x1="560" y1="160" x2="630" y2="155"/><line x1="425" y1="150" x2="390" y2="200"/><line x1="495" y1="158" x2="525" y2="222"/><line x1="560" y1="160" x2="590" y2="105"/>
<line x1="455" y1="88" x2="425" y2="150"/><line x1="525" y1="95" x2="495" y2="158"/><line x1="525" y1="95" x2="560" y2="160"/><line x1="455" y1="212" x2="425" y2="150"/>
<line x1="495" y1="158" x2="455" y2="88"/>
</g>
<circle class="c-blue" cx="395" cy="100" r="8" stroke-width="0.5"/>
<circle class="c-blue" cx="455" cy="88" r="8" stroke-width="0.5"/>
<circle class="c-blue" cx="525" cy="95" r="8" stroke-width="0.5"/>
<circle class="c-blue" cx="590" cy="105" r="8" stroke-width="0.5"/>
<circle class="c-blue" cx="630" cy="155" r="8" stroke-width="0.5"/>
<circle class="c-blue" cx="595" cy="205" r="8" stroke-width="0.5"/>
<circle class="c-blue" cx="525" cy="222" r="8" stroke-width="0.5"/>
<circle class="c-blue" cx="455" cy="212" r="8" stroke-width="0.5"/>
<circle class="c-blue" cx="390" cy="200" r="8" stroke-width="0.5"/>
<circle class="c-blue" cx="425" cy="150" r="8" stroke-width="0.5"/>
<g class="c-red"><circle cx="495" cy="158" r="8" stroke-width="0.5"/><text class="ts" x="495" y="162" text-anchor="middle" fill="#791F1F">✕</text></g>
<circle class="c-blue" cx="560" cy="160" r="8" stroke-width="0.5"/>
<text class="ts" x="505" y="248" text-anchor="middle">lose any router → ~proportional loss</text>
<text class="ts" x="340" y="272" text-anchor="middle">Every router is 2–5 hops from every other — no hierarchy, no choke points, nothing to drill down.</text>

<!-- ===== Section 2 ===== -->
<text class="th" x="40" y="304">2 · Why faults hide</text>
<g fill="none" stroke="#888780" stroke-width="1" opacity="0.5">
<path d="M80 374 Q190 330 293 331"/>
<path d="M86 384 Q210 392 323 386"/>
<path d="M82 388 Q220 430 363 416"/>
<path d="M80 386 Q190 445 298 441"/>
<path d="M307 331 Q470 330 601 374"/>
<path d="M372 346 Q500 350 600 377"/>
<path d="M337 384 Q480 392 600 382"/>
<path d="M377 416 Q510 430 603 387"/>
<path d="M312 441 Q480 455 604 389"/>
</g>
<path d="M83 372 Q230 340 358 345" fill="none" stroke="#E24B4A" stroke-width="2"/>
<text class="ts" x="185" y="334" text-anchor="middle" fill="#E24B4A">✕ marginal optic — carries 1/64th</text>
<circle class="c-gray" cx="300" cy="330" r="7" stroke-width="0.5"/>
<circle class="c-gray" cx="365" cy="345" r="7" stroke-width="0.5"/>
<circle class="c-gray" cx="330" cy="385" r="7" stroke-width="0.5"/>
<circle class="c-gray" cx="370" cy="418" r="7" stroke-width="0.5"/>
<circle class="c-gray" cx="305" cy="442" r="7" stroke-width="0.5"/>
<circle class="c-blue" cx="70" cy="380" r="11" stroke-width="0.5"/>
<text class="ts" x="70" y="408" text-anchor="middle">ToR A</text>
<circle cx="610" cy="380" r="18" fill="none" stroke="#E24B4A" stroke-width="1" stroke-dasharray="3 3"/>
<circle class="c-blue" cx="610" cy="380" r="11" stroke-width="0.5"/>
<text class="ts" x="610" y="412" text-anchor="middle">ToR B</text>
<text class="ts" x="340" y="476" text-anchor="middle">Traffic sprays across ~64 edge-disjoint paths — a marginal optic shifts many pairs by a little.</text>
<text class="ts" x="340" y="494" text-anchor="middle">Re-routing masks it: by the time a threshold alarm trips, the path margin is already spent.</text>

<!-- ===== Section 3 ===== -->
<text class="th" x="40" y="528">3 · How observability works</text>
<rect class="box" x="40" y="540" width="180" height="56" rx="6"/>
<text class="th" x="130" y="562" text-anchor="middle">Calibrate</text>
<text class="ts" x="130" y="582" text-anchor="middle">subtract rhythm + memory</text>
<rect class="box" x="255" y="540" width="180" height="56" rx="6"/>
<text class="th" x="345" y="562" text-anchor="middle">Accumulate evidence</text>
<text class="ts" x="345" y="582" text-anchor="middle">e-process per path-class</text>
<rect class="box" x="470" y="540" width="180" height="56" rx="6"/>
<text class="th" x="560" y="562" text-anchor="middle">Select degraded set</text>
<text class="ts" x="560" y="582" text-anchor="middle">e-BH under correlation</text>
<line class="arr" x1="222" y1="568" x2="251" y2="568" marker-end="url(#arrow)"/>
<line class="arr" x1="437" y1="568" x2="466" y2="568" marker-end="url(#arrow)"/>
<path class="arr" d="M560 598 C560 622 345 612 344 632" marker-end="url(#arrow)"/>
<text class="th" x="343" y="656" text-anchor="middle">Invert against the fault-domain incidence</text>

<text class="ts" x="145" y="686" text-anchor="middle">path-classes</text>
<text class="ts" x="525" y="686" text-anchor="middle">shared resources</text>

