<svg viewBox="0 0 680 922" width="680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>RNG network observability intuition</title>
<desc>Three-part diagram: fat-tree versus flat random-graph topology, why faults hide in a random graph, and how anytime-valid statistics plus tomographic inversion localize faults.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; fill: #3d3d3a; }
  .ts { font-size: 12px; fill: #73726c; }
  .th { font-size: 14px; font-weight: 500; fill: #3d3d3a; }
  .box { fill: #f7f6f2; stroke: #d3d1c7; }
  .arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
  .c-red rect, .c-red circle  { fill: #FCEBEB; stroke: #E24B4A; }
  .c-red text                 { fill: #791F1F; }
  .c-blue rect, .c-blue circle{ fill: #E6F1FB; stroke: #378ADD; }
  .c-blue text                { fill: #0C447C; }
  .c-gray rect, .c-gray circle{ fill: #F1EFE8; stroke: #B4B2A9; }
  .c-gray text                { fill: #5F5E5A; }
  rect.c-red, circle.c-red    { fill: #FCEBEB; stroke: #E24B4A; }
  rect.c-blue, circle.c-blue  { fill: #E6F1FB; stroke: #378ADD; }
  rect.c-gray, circle.c-gray  { fill: #F1EFE8; stroke: #B4B2A9; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- legend -->
<rect class="c-red" x="40" y="12" width="12" height="12" rx="3"/>
<text class="ts" x="58" y="22">degraded / firing</text>
<rect class="c-blue" x="170" y="12" width="12" height="12" rx="3"/>
<text class="ts" x="188" y="22">healthy</text>
<rect class="c-gray" x="252" y="12" width="12" height="12" rx="3"/>
<text class="ts" x="270" y="22">infrastructure</text>

<!-- ===== Section 1 ===== -->
<text class="th" x="40" y="56">1 · The topology trade</text>
<text class="ts" x="175" y="80" text-anchor="middle">Fat-tree — hierarchical</text>
<text class="ts" x="505" y="80" text-anchor="middle">RNG — flat quasi-random</text>

<!-- fat tree links -->
<g stroke="#888780" stroke-width="1" opacity="0.45">
<line x1="118" y1="116" x2="77" y2="148"/><line x1="118" y1="116" x2="147" y2="148"/><line x1="118" y1="116" x2="217" y2="148"/><line x1="118" y1="116" x2="287" y2="148"/>
<line x1="232" y1="116" x2="77" y2="148"/><line x1="232" y1="116" x2="147" y2="148"/><line x1="232" y1="116" x2="217" y2="148"/><line x1="232" y1="116" x2="287" y2="148"/>
<line x1="77" y1="170" x2="77" y2="204"/><line x1="147" y1="170" x2="147" y2="204"/><line x1="217" y1="170" x2="217" y2="204"/><line x1="287" y1="170" x2="287" y2="204"/>
<line x1="77" y1="170" x2="147" y2="204"/><line x1="217" y1="170" x2="287" y2="204"/>
</g>
<rect class="c-blue" x="90" y="92" width="56" height="24" rx="4" stroke-width="0.5"/>
<g class="c-red"><rect x="204" y="92" width="56" height="24" rx="4" stroke-width="0.5"/><text class="th" x="232" y="109" text-anchor="middle" fill="#791F1F">✕</text></g>
<rect class="c-blue" x="55" y="148" width="44" height="22" rx="4" stroke-width="0.5"/>
<rect class="c-blue" x="125" y="148" width="44" height="22" rx="4" stroke-width="0.5"/>
<rect class="c-blue" x="195" y="148" width="44" height="22" rx="4" stroke-width="0.5"/>
<rect class="c-blue" x="265" y="148" width="44" height="22" rx="4" stroke-width="0.5"/>
<rect class="c-gray" x="55" y="204" width="44" height="22" rx="4" stroke-width="0.5"/>
<rect class="c-gray" x="125" y="204" width="44" height="22" rx="4" stroke-width="0.5"/>
<rect class="c-gray" x="195" y="204" width="44" height="22" rx="4" stroke-width="0.5"/>
<rect class="c-gray" x="265" y="204" width="44" height="22" rx="4" stroke-width="0.5"/>
<text class="ts" x="175" y="248" text-anchor="middle">lose the wrong spine → outsized loss</text>

