<svg viewBox="0 0 680 1056" width="680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>How Tessera-RNG finds failing parts in a random datacenter network</title>
<desc>Layman walkthrough: two network designs compared, why faults hide in random networks, and a four-step detective process that finds the failing part.</desc>
