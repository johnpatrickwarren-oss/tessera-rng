<circle class="c-blue" cx="455" cy="256" r="8" stroke-width="0.5"/>
<circle class="c-blue" cx="390" cy="244" r="8" stroke-width="0.5"/>
<circle class="c-blue" cx="425" cy="194" r="8" stroke-width="0.5"/>
<g class="c-red"><circle cx="495" cy="202" r="8" stroke-width="0.5"/><text class="ts" x="495" y="206" text-anchor="middle" fill="#791F1F">✕</text></g>
<circle class="c-blue" cx="560" cy="204" r="8" stroke-width="0.5"/>
<text class="ts" x="505" y="292" text-anchor="middle">a social web: all routers 2–5 hops apart</text>
<text class="ts" x="505" y="308" text-anchor="middle">lose any router → ~1% capacity dip</text>
<text class="t" x="340" y="336" text-anchor="middle">The trade: far more resilient — but failures stop announcing themselves.</text>

<!-- ===== Section 2 ===== -->
<text class="th" x="40" y="370">2 · Why a failing part is so hard to spot</text>
<g fill="none" stroke="#888780" stroke-width="1" opacity="0.5">
<path d="M80 436 Q190 392 293 393"/>
<path d="M86 446 Q210 454 323 448"/>
<path d="M82 450 Q220 492 363 478"/>
<path d="M80 448 Q190 507 298 503"/>
<path d="M307 393 Q470 392 601 436"/>
<path d="M372 408 Q500 412 600 439"/>
<path d="M337 446 Q480 454 600 444"/>
<path d="M377 478 Q510 492 603 449"/>
<path d="M312 503 Q480 517 604 451"/>
</g>
<path d="M83 434 Q230 402 358 407" fill="none" stroke="#E24B4A" stroke-width="2"/>
<text class="ts" x="175" y="396" text-anchor="middle" fill="#E24B4A">✕ one weak optic (1/64 of traffic)</text>
<circle class="c-gray" cx="300" cy="392" r="7" stroke-width="0.5"/>
<circle class="c-gray" cx="365" cy="407" r="7" stroke-width="0.5"/>
<circle class="c-gray" cx="330" cy="447" r="7" stroke-width="0.5"/>
<circle class="c-gray" cx="370" cy="480" r="7" stroke-width="0.5"/>
<circle class="c-gray" cx="305" cy="504" r="7" stroke-width="0.5"/>
<circle class="c-blue" cx="70" cy="442" r="11" stroke-width="0.5"/>
<text class="ts" x="70" y="470" text-anchor="middle">rack A</text>
<circle cx="610" cy="442" r="18" fill="none" stroke="#E24B4A" stroke-width="1" stroke-dasharray="3 3"/>
<circle class="c-blue" cx="610" cy="442" r="11" stroke-width="0.5"/>
<text class="ts" x="610" y="474" text-anchor="middle">rack B</text>
<text class="ts" x="340" y="538" text-anchor="middle">Traffic between two racks is split into tiny streams across ~64 different routes.</text>
<text class="ts" x="340" y="556" text-anchor="middle">A weak part breaks nothing — it makes thousands of routes each slightly worse.</text>
<text class="ts" x="340" y="574" text-anchor="middle">Automatic re-routing then hides even that. No ordinary alarm ever trips.</text>

<!-- ===== Section 3 ===== -->
<text class="th" x="40" y="606">3 · How we find it anyway</text>
<rect class="box" x="40" y="620" width="180" height="64" rx="6"/>
<text class="th" x="130" y="642" text-anchor="middle">Learn normal</text>
<text class="ts" x="130" y="660" text-anchor="middle">every route's daily rhythm</text>
<text class="ts" x="130" y="676" text-anchor="middle">(calibration)</text>
<rect class="box" x="255" y="620" width="180" height="64" rx="6"/>
<text class="th" x="345" y="642" text-anchor="middle">Add up weak hints</text>
<text class="ts" x="345" y="660" text-anchor="middle">evidence accrues over time</text>
<text class="ts" x="345" y="676" text-anchor="middle">(anytime-valid e-process)</text>
<rect class="box" x="470" y="620" width="180" height="64" rx="6"/>
<text class="th" x="560" y="642" text-anchor="middle">Cap false alarms</text>
<text class="ts" x="560" y="660" text-anchor="middle">false alarms stay capped</text>
<text class="ts" x="560" y="676" text-anchor="middle">(e-BH FDR control)</text>
<line class="arr" x1="222" y1="652" x2="251" y2="652" marker-end="url(#arrow)"/>
<line class="arr" x1="437" y1="652" x2="466" y2="652" marker-end="url(#arrow)"/>
<path class="arr" d="M560 686 C560 712 345 700 344 720" marker-end="url(#arrow)"/>
<text class="th" x="340" y="744" text-anchor="middle">4 · Work backwards to the part — the detective step</text>

<text class="ts" x="145" y="772" text-anchor="middle">groups of routes</text>
<text class="ts" x="480" y="772" text-anchor="middle">physical suspects</text>

